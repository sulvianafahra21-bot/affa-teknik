<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja | Affa Teknik</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script>(function(){var d=document.documentElement,k="affaTema";try{var t=localStorage.getItem(k)||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");d.dataset.theme=t}catch(e){d.dataset.theme="light"}document.addEventListener("click",function(e){if(!e.target.closest(".theme-toggle"))return;var n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem(k,n)}catch(x){}})})()</script>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data-produk.js"></script>
  <script defer src="js/utama.js"></script>
  <script defer src="js/keranjang.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-banner compact-banner"><div><span class="eyebrow">Belanja kamu</span><h1>Keranjang belanja</h1><p>Periksa kembali produk sebelum melanjutkan ke proses pemesanan.</p></div><div class="banner-art"><img src="images/logo-affateknik.png" alt="Logo Affa Teknik"></div></section>
    <section class="section cart-section">
      <div class="checkout-steps simple-steps"><div class="step active"><span>1</span><b>Keranjang</b></div><div class="step"><span>2</span><b>Pengiriman</b></div><div class="step"><span>3</span><b>Konfirmasi</b></div></div>
      <div id="cart-content"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
