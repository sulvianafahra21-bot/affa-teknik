<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan | Affa Teknik</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script>(function(){var d=document.documentElement,k="affaTema";try{var t=localStorage.getItem(k)||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");d.dataset.theme=t}catch(e){d.dataset.theme="light"}document.addEventListener("click",function(e){if(!e.target.closest(".theme-toggle"))return;var n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem(k,n)}catch(x){}})})()</script>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data-produk.js"></script>
  <script defer src="js/utama.js"></script>
  <script defer src="js/pesanan.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-banner compact-banner"><div><span class="eyebrow">Pesanan kamu</span><h1>Riwayat pesanan</h1><p>Pesanan yang sudah dikonfirmasi di browser ini beserta status dan bukti pembayarannya.</p></div><div class="banner-art"><img src="images/logo-affateknik.png" alt="Logo Affa Teknik"></div></section>
    <section class="section"><div id="orders-root"></div></section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
